# Ajustez les versions ci-dessous pour correspondre exactement à votre pack.
# Ce sont les versions cohérentes avec Minecraft 1.21.1 / Fabric au moment de l'écriture.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9
fabric_version=0.107.0+1.21.1

mod_version=0.1.0
maven_group=com.cvnights
archives_base_name=cvnights

# Mémoire Gradle : le remapping de ~55 mods (dont le gros Cobblemon) est gourmand,
# les runners GitHub Actions ont besoin de plus que le défaut (~512m-1g).
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=false
