plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // --- Dépendances du modpack, téléchargées automatiquement depuis le maven officiel
    //     de Modrinth (mêmes .jar exacts que ceux que tu m'as fournis) ---
    modImplementation "maven.modrinth:MdwFAVRL:kF7CvxTo"   // Cobblemon 1.7.3 (fabric, 1.21.1)
    modImplementation "maven.modrinth:2rL16t1O:WU6cJeLI"   // Enhanced Celestials 6.0.2.5 (fabric, 1.21.1)
    modImplementation "maven.modrinth:NPCfuUI4:ze3sTR1C"   // Cobblemon Integrations 1.1.6 (fabric, 1.21.1)
    modImplementation "maven.modrinth:z2XEADmE:HdxFQv4r"   // Data Anchor 2.0.0.3 (fabric, 1.21.1) - dépendance d'Enhanced Celestials
    modImplementation "maven.modrinth:Ha28R6CL:FayzGq0c"   // Fabric Language Kotlin 1.12.1 (requis par Cobblemon)

    // Le stdlib Kotlin en clair pour la compilation (au cas où il ne serait pas exposé
    // correctement par le jar de Fabric Language Kotlin via ce chemin de dépendance)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.20"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
